<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} — Zardar Khan</title>
  <meta name="description" content="{{ page.excerpt | strip_html | truncate: 160 }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">

  <style>
    /* Nav */
    .nav {
      padding: 24px 0;
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }

    .nav a {
      margin-right: 24px;
      color: var(--text-muted);
    }

    .nav a:hover {
      color: var(--text);
      text-decoration: none;
    }

    :root {
      --bg: #ffffff;
      --bg-elevated: #f8f9fa;
      --bg-code: #f1f3f5;
      --text: #1a1a1a;
      --text-muted: #6b7280;
      --accent: #059669;
      --border: #e5e7eb;
      --font-mono: 'JetBrains Mono', monospace;
      --font-serif: 'Source Serif 4', Georgia, serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-serif);
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    .container {
      max-width: 680px;
      margin: 0 auto;
      padding: 0 24px;
    }

    article {
      padding: 80px 0 48px;
    }

    .article-header {
      margin-bottom: 48px;
    }

    .article-meta {
      font-family: var(--font-mono);
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    .back-link {
      margin-right: 16px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.02em;
    }

    .content {
      font-size: 1.05rem;
    }

    .content > * + * {
      margin-top: 1.5em;
    }

    .content h2 {
      font-size: 1.3rem;
      font-weight: 600;
      margin-top: 2.5em;
      margin-bottom: 0.5em;
      padding-top: 1em;
      border-top: 1px solid var(--border);
    }

    .content h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-top: 2em;
      margin-bottom: 0.5em;
    }

    .content p {
      color: var(--text-muted);
    }

    .content strong {
      color: var(--text);
      font-weight: 600;
    }

    .content ul, .content ol {
      padding-left: 1.5em;
      color: var(--text-muted);
    }

    .content li {
      margin-bottom: 0.5em;
    }

    .content li::marker {
      color: var(--accent);
    }

    .content blockquote {
      border-left: 3px solid var(--accent);
      padding-left: 1.5em;
      margin-left: 0;
      color: var(--text-muted);
      font-style: italic;
    }

    .content code {
      font-family: var(--font-mono);
      font-size: 0.9em;
      background: var(--bg-code);
      padding: 0.2em 0.4em;
      border-radius: 4px;
    }

    .content pre {
      background: var(--bg-code);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.5em;
      overflow-x: auto;
      font-size: 0.85rem;
    }

    .content pre code {
      background: none;
      padding: 0;
    }

    .content hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 3em 0;
    }

    .content img {
      max-width: 100%;
      border-radius: 8px;
    }

    .post-footer {
      margin-top: 48px;
      padding-top: 32px;
      border-top: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }

    footer {
      padding: 32px 0;
      text-align: center;
      font-family: var(--font-mono);
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    @media (max-width: 640px) {
      article { padding: 48px 0 32px; }
      h1 { font-size: 1.5rem; }
    }
  </style>
</head>
<body>
  <nav class="nav">
    <div class="container">
      <a href="/">home</a>
      <a href="/projects">projects</a>
      <a href="/blog">writing</a>
      <a href="/resume">resume</a>
    </div>
  </nav>

  <main>
    <article>
      <div class="container">
        <div class="article-header">
          <div class="article-meta">
            <span>{{ page.date | date: "%b %d, %Y" }}</span>
          </div>
          <h1>{{ page.title }}</h1>
        </div>

        <div class="content">
          {{ content }}
        </div>

        <div class="post-footer">
          <a href="/blog">← all posts</a>
        </div>
      </div>
    </article>
  </main>

  <footer>
    <div class="container">
      © 2025 Zardar Khan
    </div>
  </footer>
</body>
</html>
