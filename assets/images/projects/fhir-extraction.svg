<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f8f9fa"/>
  <!-- Database cylinder -->
  <ellipse cx="80" cy="100" rx="40" ry="15" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
  <rect x="40" y="100" width="80" height="80" fill="#e5e7eb"/>
  <ellipse cx="80" cy="180" rx="40" ry="15" fill="#e5e7eb" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="40" y1="100" x2="40" y2="180" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="120" y1="100" x2="120" y2="180" stroke="#6b7280" stroke-width="1.5"/>
  <!-- Flow lines -->
  <path d="M130 140 L180 140" stroke="#059669" stroke-width="2"/>
  <path d="M175 135 L185 140 L175 145" stroke="#059669" stroke-width="2" fill="none"/>
  <!-- Processing box -->
  <rect x="190" y="110" width="80" height="60" rx="4" fill="#059669" opacity="0.15" stroke="#059669" stroke-width="2"/>
  <text x="210" y="145" font-family="monospace" font-size="11" fill="#059669">FHIR</text>
  <!-- Output arrow -->
  <path d="M280 140 L320 140" stroke="#059669" stroke-width="2"/>
  <path d="M315 135 L325 140 L315 145" stroke="#059669" stroke-width="2" fill="none"/>
  <!-- Output documents -->
  <rect x="330" y="80" width="50" height="40" rx="3" fill="#fff" stroke="#059669" stroke-width="1.5"/>
  <rect x="340" y="130" width="50" height="40" rx="3" fill="#fff" stroke="#059669" stroke-width="1.5"/>
  <rect x="330" y="180" width="50" height="40" rx="3" fill="#fff" stroke="#059669" stroke-width="1.5"/>
  <!-- Speed indicator -->
  <text x="200" y="210" font-family="monospace" font-size="11" fill="#6b7280">700x</text>
</svg>