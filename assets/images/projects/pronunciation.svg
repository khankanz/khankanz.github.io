<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f8f9fa"/>
  <!-- Audio waveform -->
  <g stroke="#059669" stroke-width="3" stroke-linecap="round" opacity="0.6">
    <line x1="60" y1="150" x2="60" y2="150"/>
    <line x1="75" y1="130" x2="75" y2="170"/>
    <line x1="90" y1="110" x2="90" y2="190"/>
    <line x1="105" y1="90" x2="105" y2="210"/>
    <line x1="120" y1="120" x2="120" y2="180"/>
    <line x1="135" y1="100" x2="135" y2="200"/>
    <line x1="150" y1="130" x2="150" y2="170"/>
    <line x1="165" y1="115" x2="165" y2="185"/>
    <line x1="180" y1="140" x2="180" y2="160"/>
  </g>
  <!-- Arrow -->
  <path d="M200 150 L240 150" stroke="#6b7280" stroke-width="2"/>
  <path d="M235 145 L245 150 L235 155" stroke="#6b7280" stroke-width="2" fill="none"/>
  <!-- IPA text -->
  <rect x="260" y="100" width="100" height="100" rx="6" fill="#fff" stroke="#e5e7eb" stroke-width="2"/>
  <text x="280" y="140" font-family="serif" font-size="20" fill="#1a1a1a">/mɪˈrɑːʒ/</text>
  <text x="295" y="170" font-family="monospace" font-size="12" fill="#059669">✓</text>
</svg>