<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f8f9fa"/>
  <!-- JSON brackets -->
  <text x="60" y="100" font-family="monospace" font-size="72" fill="#059669" opacity="0.3">{</text>
  <text x="300" y="220" font-family="monospace" font-size="72" fill="#059669" opacity="0.3">}</text>
  <!-- Schema lines -->
  <rect x="100" y="80" width="180" height="12" rx="2" fill="#059669" opacity="0.6"/>
  <rect x="120" y="110" width="140" height="8" rx="2" fill="#6b7280" opacity="0.4"/>
  <rect x="120" y="130" width="160" height="8" rx="2" fill="#6b7280" opacity="0.4"/>
  <rect x="100" y="160" width="200" height="12" rx="2" fill="#059669" opacity="0.6"/>
  <rect x="120" y="190" width="120" height="8" rx="2" fill="#6b7280" opacity="0.4"/>
  <!-- Checkmark -->
  <circle cx="320" cy="80" r="24" fill="#059669" opacity="0.15"/>
  <path d="M308 80 L316 88 L332 72" stroke="#059669" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>