<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f8f9fa"/>
  <!-- CSV file icon -->
  <rect x="50" y="60" width="80" height="100" rx="4" fill="#fff" stroke="#e5e7eb" stroke-width="2"/>
  <rect x="60" y="80" width="25" height="6" rx="1" fill="#6b7280" opacity="0.4"/>
  <rect x="90" y="80" width="30" height="6" rx="1" fill="#6b7280" opacity="0.4"/>
  <rect x="60" y="95" width="25" height="6" rx="1" fill="#6b7280" opacity="0.3"/>
  <rect x="90" y="95" width="30" height="6" rx="1" fill="#6b7280" opacity="0.3"/>
  <rect x="60" y="110" width="25" height="6" rx="1" fill="#6b7280" opacity="0.3"/>
  <rect x="90" y="110" width="30" height="6" rx="1" fill="#6b7280" opacity="0.3"/>
  <rect x="60" y="125" width="25" height="6" rx="1" fill="#6b7280" opacity="0.3"/>
  <rect x="90" y="125" width="30" height="6" rx="1" fill="#6b7280" opacity="0.3"/>
  <text x="70" y="150" font-family="monospace" font-size="8" fill="#6b7280">.csv</text>
  <!-- Arrow to DuckDB -->
  <path d="M145 110 L175 110" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  <path d="M170 105 L180 110 L170 115" stroke="#059669" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- DuckDB box -->
  <rect x="190" y="80" width="90" height="60" rx="6" fill="#059669" opacity="0.15" stroke="#059669" stroke-width="2"/>
  <text x="207" y="105" font-family="monospace" font-size="10" fill="#059669">SELECT</text>
  <text x="207" y="118" font-family="monospace" font-size="10" fill="#059669">SUM(amt)</text>
  <text x="207" y="131" font-family="monospace" font-size="9" fill="#6b7280">FROM data</text>
  <!-- Arrow to result -->
  <path d="M295 110 L325 110" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
  <path d="M320 105 L330 110 L320 115" stroke="#059669" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Result -->
  <rect x="340" y="90" width="50" height="40" rx="4" fill="#fff" stroke="#059669" stroke-width="2"/>
  <text x="350" y="115" font-family="monospace" font-size="11" fill="#059669">$70</text>
  <!-- Coffee cup icon below -->
  <path d="M220 200 L220 240 Q220 250 230 250 L250 250 Q260 250 260 240 L260 200 Z" fill="none" stroke="#6b7280" stroke-width="2" opacity="0.5"/>
  <path d="M260 210 Q280 210 280 225 Q280 240 260 240" fill="none" stroke="#6b7280" stroke-width="2" opacity="0.5"/>
  <path d="M225 190 Q230 180 235 190 Q240 180 245 190 Q250 180 255 190" fill="none" stroke="#6b7280" stroke-width="1.5" opacity="0.3"/>
  <!-- X through coffee -->
  <line x1="210" y1="260" x2="270" y2="185" stroke="#dc2626" stroke-width="2" opacity="0.6"/>
</svg>