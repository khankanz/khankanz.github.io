<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f8f9fa"/>
  <!-- Pipeline flow -->
  <!-- NLP Output box -->
  <rect x="30" y="120" width="70" height="40" rx="4" fill="#059669" opacity="0.2" stroke="#059669" stroke-width="1.5"/>
  <text x="65" y="145" font-family="monospace" font-size="9" fill="#059669" text-anchor="middle">NLP Output</text>

  <!-- Arrow 1 -->
  <path d="M105 140 L135 140" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- FHIR Resources box -->
  <rect x="140" y="100" width="80" height="80" rx="4" fill="#059669" opacity="0.15" stroke="#059669" stroke-width="1.5"/>
  <text x="180" y="125" font-family="monospace" font-size="8" fill="#059669" text-anchor="middle">Device</text>
  <text x="180" y="140" font-family="monospace" font-size="8" fill="#059669" text-anchor="middle">Composition</text>
  <text x="180" y="155" font-family="monospace" font-size="8" fill="#059669" text-anchor="middle">Observation</text>
  <text x="180" y="170" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">(FHIR R4)</text>

  <!-- Arrow 2 -->
  <path d="M225 140 L255 140" stroke="#6b7280" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- OMOP CDM box -->
  <rect x="260" y="120" width="70" height="40" rx="4" fill="#059669" stroke="#059669" stroke-width="1.5"/>
  <text x="295" y="145" font-family="monospace" font-size="9" fill="#ffffff" text-anchor="middle">OMOP CDM</text>

  <!-- Terminology mapping annotation -->
  <path d="M180 95 L180 70 L295 70 L295 115" stroke="#6b7280" stroke-width="1" stroke-dasharray="3,2" fill="none"/>
  <text x="240" y="60" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">RadLex → SNOMED</text>

  <!-- HL7 IG label -->
  <text x="180" y="200" font-family="monospace" font-size="7" fill="#6b7280" text-anchor="middle">HL7 Breast Radiology IG</text>

  <!-- Bottom insight -->
  <text x="200" y="270" font-family="monospace" font-size="9" fill="#6b7280" text-anchor="middle">interoperability: the real deliverable</text>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#6b7280"/>
    </marker>
  </defs>
</svg>
