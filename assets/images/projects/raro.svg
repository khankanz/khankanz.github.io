<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f8f9fa"/>
  <!-- Training loss chart going wrong -->
  <rect x="60" y="60" width="280" height="180" rx="4" fill="#fff" stroke="#e5e7eb" stroke-width="2"/>
  <!-- Axes -->
  <line x1="90" y1="210" x2="310" y2="210" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="90" y1="210" x2="90" y2="90" stroke="#6b7280" stroke-width="1.5"/>
  <!-- Loss line going up (bad) -->
  <path d="M100 180 Q150 170 180 160 Q210 155 240 165 Q270 180 300 200" stroke="#dc2626" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Expected line (dashed) -->
  <path d="M100 180 Q150 160 180 140 Q210 125 240 115 Q270 108 300 105" stroke="#059669" stroke-width="2" fill="none" stroke-dasharray="6,4" opacity="0.5"/>
  <!-- Labels -->
  <text x="190" y="235" font-family="monospace" font-size="10" fill="#6b7280">epochs</text>
  <text x="55" y="150" font-family="monospace" font-size="10" fill="#6b7280" transform="rotate(-90, 55, 150)">loss</text>
  <!-- X mark -->
  <circle cx="300" cy="200" r="12" fill="#dc2626" opacity="0.2"/>
  <path d="M294 194 L306 206 M306 194 L294 206" stroke="#dc2626" stroke-width="2" stroke-linecap="round"/>
</svg>