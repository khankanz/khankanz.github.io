<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f8f9fa"/>
  <!-- 3D blocks/cubes -->
  <g transform="translate(100, 80)">
    <!-- Block 1 -->
    <polygon points="0,40 40,20 80,40 40,60" fill="#059669" opacity="0.3"/>
    <polygon points="0,40 0,80 40,100 40,60" fill="#059669" opacity="0.5"/>
    <polygon points="40,60 40,100 80,80 80,40" fill="#059669" opacity="0.4"/>
  </g>
  <g transform="translate(160, 100)">
    <!-- Block 2 -->
    <polygon points="0,40 40,20 80,40 40,60" fill="#6b7280" opacity="0.2"/>
    <polygon points="0,40 0,80 40,100 40,60" fill="#6b7280" opacity="0.3"/>
    <polygon points="40,60 40,100 80,80 80,40" fill="#6b7280" opacity="0.25"/>
  </g>
  <g transform="translate(130, 40)">
    <!-- Block 3 stacked -->
    <polygon points="0,40 40,20 80,40 40,60" fill="#059669" opacity="0.4"/>
    <polygon points="0,40 0,80 40,100 40,60" fill="#059669" opacity="0.6"/>
    <polygon points="40,60 40,100 80,80 80,40" fill="#059669" opacity="0.5"/>
  </g>
  <!-- Code snippet -->
  <rect x="250" y="80" width="120" height="100" rx="6" fill="#1a1a1a" opacity="0.9"/>
  <text x="262" y="105" font-family="monospace" font-size="9" fill="#059669">local part</text>
  <text x="262" y="120" font-family="monospace" font-size="9" fill="#6b7280">part.Touched</text>
  <text x="262" y="135" font-family="monospace" font-size="9" fill="#6b7280">  :Connect(</text>
  <text x="262" y="150" font-family="monospace" font-size="9" fill="#e5e7eb">    onTouch</text>
  <text x="262" y="165" font-family="monospace" font-size="9" fill="#6b7280">  )</text>
</svg>