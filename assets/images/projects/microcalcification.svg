<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" fill="#f8f9fa"/>
  <!-- Bar chart comparing models -->
  <text x="50" y="40" font-family="monospace" font-size="10" fill="#6b7280">Accuracy %</text>
  <!-- Y-axis -->
  <line x1="70" y1="50" x2="70" y2="220" stroke="#e5e7eb" stroke-width="1"/>
  <!-- X-axis -->
  <line x1="70" y1="220" x2="350" y2="220" stroke="#e5e7eb" stroke-width="1"/>
  <!-- RadBERT bar - winner -->
  <rect x="90" y="70" width="50" height="150" rx="2" fill="#059669"/>
  <text x="95" y="240" font-family="monospace" font-size="8" fill="#059669">RadBERT</text>
  <text x="105" y="62" font-family="monospace" font-size="9" fill="#059669">94%</text>
  <!-- Yi-34B bar -->
  <rect x="160" y="110" width="50" height="110" rx="2" fill="#6b7280" opacity="0.6"/>
  <text x="168" y="240" font-family="monospace" font-size="8" fill="#6b7280">Yi-34B</text>
  <text x="175" y="102" font-family="monospace" font-size="9" fill="#6b7280">79%</text>
  <!-- Meditron bar - collapsed -->
  <rect x="230" y="175" width="50" height="45" rx="2" fill="#dc2626" opacity="0.5"/>
  <text x="232" y="240" font-family="monospace" font-size="8" fill="#dc2626">Meditron</text>
  <text x="245" y="167" font-family="monospace" font-size="9" fill="#dc2626">34%</text>
  <!-- Arrow showing collapse -->
  <path d="M255 140 L255 165" stroke="#dc2626" stroke-width="1.5" stroke-dasharray="3,2"/>
  <path d="M250 160 L255 170 L260 160" stroke="#dc2626" stroke-width="1.5" fill="none"/>
  <text x="265" y="155" font-family="monospace" font-size="7" fill="#dc2626">few-shot</text>
  <!-- Insight text -->
  <text x="100" y="275" font-family="monospace" font-size="9" fill="#6b7280">bigger ≠ better for medical text</text>
</svg>