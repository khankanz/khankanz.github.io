title: "Zardar Khan"
description: "Applied AI Engineer specializing in clinical NLP systems. Production LLM pipelines in healthcare."
url: "https://khankanz.github.io"
author: "Zardar Khan"

# Build settings
markdown: kramdown
highlighter: rouge
future: true

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Exclude files
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

# Permalink structure
permalink: /:year/:month/:day/:title.html

# Collections
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
